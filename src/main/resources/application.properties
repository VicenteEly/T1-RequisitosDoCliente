spring.application.name=colaboradores

# ------------------------------------------------------------------
# Banco de dados: H2 em memoria (nao exige instalacao de nada)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:colaboradores;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantido ativo para serializar entidades com relacionamento lazy.
spring.jpa.open-in-view=true

# ------------------------------------------------------------------
# Console H2 -> http://localhost:8080/h2-console
# ------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# Swagger / OpenAPI -> http://localhost:8080/swagger-ui.html
# ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
